AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: Pulsar HTTPS prototype - private S3 assets served by Lambda and an API Gateway ad serving and analytics API

Metadata:
  AWSToolsMetrics:
    AWSAgentToolkit: aws-cloudformation@3

Parameters:
  DeploymentPermissionsBoundary:
    Type: String
    Default: ''
    Description: Optional IAM managed policy ARN constraining SAM-generated Lambda execution roles
    AllowedPattern: '^$|^arn:[a-z0-9-]+:iam::[0-9]{12}:policy/.+$'
  BudgetEmail:
    Type: String
    NoEcho: true
    Description: Email address for actual-spend warnings; budgets do not impose a hard spending cap
    AllowedPattern: '^[^@\s]+@[^@\s]+\.[^@\s]+$'
  AdminKey:
    Type: String
    NoEcho: true
    MinLength: 32
    Description: Secret admin API key; supply securely during deployment and rotate by updating the stack.

Conditions:
  HasDeploymentPermissionsBoundary: !Not [!Equals [!Ref DeploymentPermissionsBoundary, '']]

Globals:
  Function:
    Runtime: nodejs24.x
    MemorySize: 256
    Timeout: 10
    PermissionsBoundary: !If
      - HasDeploymentPermissionsBoundary
      - !Ref DeploymentPermissionsBoundary
      - !Ref AWS::NoValue
    Environment:
      Variables:
        TABLE_NAME: !Ref AdPlatform

Resources:
  AdPlatform:
    Type: AWS::DynamoDB::Table
    DeletionPolicy: Delete
    UpdateReplacePolicy: Delete
    Metadata:
      com.aws.cloudformation.Context:
        why: Disposable showcase state; on-demand billing avoids idle provisioned capacity.
        must:
          - Stack deletion and replacement intentionally delete demo data.
    Properties:
      BillingMode: PAY_PER_REQUEST
      TimeToLiveSpecification:
        AttributeName: expiresAt
        Enabled: true
      AttributeDefinitions:
        - AttributeName: PK
          AttributeType: S
        - AttributeName: SK
          AttributeType: S
      KeySchema:
        - AttributeName: PK
          KeyType: HASH
        - AttributeName: SK
          KeyType: RANGE

  HttpApi:
    Type: AWS::Serverless::HttpApi
    Properties:
      DefaultRouteSettings:
        ThrottlingRateLimit: 5
        ThrottlingBurstLimit: 20
      CorsConfiguration:
        AllowOrigins:
          - http://127.0.0.1:5173
        AllowMethods: [GET, POST, PUT, OPTIONS]
        AllowHeaders: [Content-Type, x-admin-key]
    Metadata:
      com.aws.cloudformation.Context:
        why: Public prototype API; origin restriction and modest throttling limit browser access and bursts, not authorization.
        must:
          - Same-origin site traffic needs no CORS grant; allow only the local demo cross-origin.

  SiteBucket:
    Type: AWS::S3::Bucket
    DeletionPolicy: Delete
    UpdateReplacePolicy: Delete
    Metadata:
      com.aws.cloudformation.Context:
        why: Disposable static build artifacts; SSE-S3 avoids a paid customer-managed key and version history is unnecessary.
        must:
          - Keep private; serve objects only through the website Lambda.
          - Empty the bucket before stack deletion or replacement; CloudFormation does not delete its objects.
    Properties:
      CorsConfiguration:
        CorsRules:
          - AllowedOrigins: ['*']
            AllowedMethods: [PUT]
            AllowedHeaders: [Content-Type]
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        IgnorePublicAcls: true
        BlockPublicPolicy: true
        RestrictPublicBuckets: true
      OwnershipControls:
        Rules:
          - ObjectOwnership: BucketOwnerEnforced


  SiteBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Metadata:
      com.aws.cloudformation.Context:
        why: Private assets are read by the website execution role; deny all non-TLS storage access.
        must:
          - Deny non-TLS requests for both bucket and objects.
    Properties:
      Bucket: !Ref SiteBucket
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Sid: DenyInsecureTransport
            Effect: Deny
            Principal: '*'
            Action: s3:*
            Resource:
              - !GetAtt SiteBucket.Arn
              - !Sub '${SiteBucket.Arn}/*'
            Condition:
              Bool:
                aws:SecureTransport: 'false'

  SiteLogGroup:
    Type: AWS::Logs::LogGroup
    DeletionPolicy: Delete
    UpdateReplacePolicy: Delete
    Properties:
      LogGroupName: !Sub '/aws/lambda/${AWS::StackName}-site'
      RetentionInDays: 7

  SiteFunction:
    Type: AWS::Serverless::Function
    DependsOn: SiteLogGroup
    Properties:
      FunctionName: !Sub '${AWS::StackName}-site'
      CodeUri: .
      Handler: site.handler
      Environment:
        Variables:
          SITE_BUCKET: !Ref SiteBucket
      Policies:
        - Statement:
            - Effect: Allow
              Action: s3:GetObject
              Resource: !Sub '${SiteBucket.Arn}/*'
            - Effect: Allow
              Action: s3:ListBucket
              Resource: !GetAtt SiteBucket.Arn
      Events:
        Index:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /
            Method: GET
        Assets:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /{proxy+}
            Method: GET
    Metadata:
      com.aws.cloudformation.Context:
        why: HTTPS static hosting without CloudFront, which this account cannot create until AWS verification.
        must:
          - Read only the private site bucket; never return index.html for missing assets.
          - Specific ad and stats routes take precedence over the static asset route.
      BuildMethod: esbuild
      BuildProperties:
        Target: es2022
        Format: cjs
        OutExtension: ['.js=.cjs']
        Minify: true
        EntryPoints: [src/handlers/site.ts]

  GetAdLogGroup:
    Type: AWS::Logs::LogGroup
    DeletionPolicy: Delete
    UpdateReplacePolicy: Delete
    Properties:
      LogGroupName: !Sub '/aws/lambda/${AWS::StackName}-get-ad'
      RetentionInDays: 7

  PostEventsLogGroup:
    Type: AWS::Logs::LogGroup
    DeletionPolicy: Delete
    UpdateReplacePolicy: Delete
    Properties:
      LogGroupName: !Sub '/aws/lambda/${AWS::StackName}-post-events'
      RetentionInDays: 7

  GetStatsLogGroup:
    Type: AWS::Logs::LogGroup
    DeletionPolicy: Delete
    UpdateReplacePolicy: Delete
    Properties:
      LogGroupName: !Sub '/aws/lambda/${AWS::StackName}-get-stats'
      RetentionInDays: 7
  AdminLogGroup:
    Type: AWS::Logs::LogGroup
    DeletionPolicy: Delete
    UpdateReplacePolicy: Delete
    Properties:
      LogGroupName: !Sub '/aws/lambda/${AWS::StackName}-admin'
      RetentionInDays: 7

  AdminFunction:
    Type: AWS::Serverless::Function
    DependsOn: AdminLogGroup
    Properties:
      FunctionName: !Sub '${AWS::StackName}-admin'
      CodeUri: .
      Handler: admin.handler
      Environment:
        Variables:
          ADMIN_KEY: !Ref AdminKey
          SITE_BUCKET: !Ref SiteBucket
      Policies:
        - Statement:
            - Effect: Allow
              Action: [dynamodb:Scan, dynamodb:Query, dynamodb:GetItem, dynamodb:PutItem, dynamodb:UpdateItem]
              Resource: !GetAtt AdPlatform.Arn
            - Effect: Allow
              Action: s3:PutObject
              Resource: !Sub '${SiteBucket.Arn}/uploads/*'
      Events:
        ListCampaigns:
          Type: HttpApi
          Properties: {ApiId: !Ref HttpApi, Path: /campaigns, Method: GET}
        CreateCampaign:
          Type: HttpApi
          Properties: {ApiId: !Ref HttpApi, Path: /campaigns, Method: POST}
        UpdateCampaign:
          Type: HttpApi
          Properties: {ApiId: !Ref HttpApi, Path: '/campaigns/{id}', Method: PUT}
        CreateCreative:
          Type: HttpApi
          Properties: {ApiId: !Ref HttpApi, Path: '/campaigns/{id}/creatives', Method: POST}
        Upload:
          Type: HttpApi
          Properties: {ApiId: !Ref HttpApi, Path: /uploads, Method: POST}
    Metadata:
      com.aws.cloudformation.Context:
        why: Authenticated administration and short-lived upload URLs for the private site bucket.
        must:
          - Keep upload permissions confined to the uploads prefix and include this function in the cost guard.
      BuildMethod: esbuild
      BuildProperties:
        Target: es2022
        Format: cjs
        OutExtension: ['.js=.cjs']
        Minify: true
        EntryPoints: [src/handlers/admin.ts]


  GetAdFunction:
    Type: AWS::Serverless::Function
    DependsOn: GetAdLogGroup
    Properties:
      FunctionName: !Sub '${AWS::StackName}-get-ad'
      CodeUri: .
      Handler: getAd.handler
      Policies:
        - Statement:
            - Effect: Allow
              Action:
                - dynamodb:Scan
                - dynamodb:Query
                - dynamodb:UpdateItem
              Resource: !GetAtt AdPlatform.Arn
      Events:
        GetAd:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /ad
            Method: GET
    Metadata:
      com.aws.cloudformation.Context:
        why: Serves and accounts for ads; precreated log group bounds diagnostics retention.
        must:
          - Function name must match its log group suffix.
      BuildMethod: esbuild
      BuildProperties:
        Target: es2022
        Format: cjs
        OutExtension: ['.js=.cjs']
        Minify: true
        EntryPoints: [src/handlers/getAd.ts]

  PostEventsFunction:
    Type: AWS::Serverless::Function
    DependsOn: PostEventsLogGroup
    Properties:
      FunctionName: !Sub '${AWS::StackName}-post-events'
      CodeUri: .
      Handler: postEvents.handler
      Environment:
        Variables:
          FIREHOSE_STREAM_NAME: !Ref EventStream
      Policies:
        - Statement:
            - Effect: Allow
              Action: [dynamodb:PutItem, dynamodb:GetItem, dynamodb:UpdateItem, dynamodb:TransactWriteItems]
              Resource: !GetAtt AdPlatform.Arn
            - Effect: Allow
              Action: firehose:PutRecordBatch
              Resource: !GetAtt EventStream.Arn
      Events:
        PostEvents:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /events
            Method: POST
    Metadata:
      com.aws.cloudformation.Context:
        why: Records real client events; precreated log group bounds diagnostics retention.
        must:
          - Function name must match its log group suffix.
      BuildMethod: esbuild
      BuildProperties:
        Target: es2022
        Format: cjs
        OutExtension: ['.js=.cjs']
        Minify: true
        EntryPoints: [src/handlers/postEvents.ts]

  GetStatsFunction:
    Type: AWS::Serverless::Function
    DependsOn: GetStatsLogGroup
    Properties:
      FunctionName: !Sub '${AWS::StackName}-get-stats'
      CodeUri: .
      Handler: getStats.handler
      Policies:
        - Statement:
            - Effect: Allow
              Action: dynamodb:Query
              Resource: !GetAtt AdPlatform.Arn
      Events:
        GetStats:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /stats
            Method: GET
    Metadata:
      com.aws.cloudformation.Context:
        why: Reads recorded analytics; precreated log group bounds diagnostics retention.
        must:
          - Function name must match its log group suffix.
      BuildMethod: esbuild
      BuildProperties:
        Target: es2022
        Format: cjs
        OutExtension: ['.js=.cjs']
        Minify: true
        EntryPoints: [src/handlers/getStats.ts]

  RawEventsBucket:
    Type: AWS::S3::Bucket
    DeletionPolicy: Delete
    UpdateReplacePolicy: Delete
    Metadata:
      com.aws.cloudformation.Context:
        why: Disposable encrypted analytics data and failed conversion records without version storage costs.
        must:
          - Empty all objects before stack deletion or replacement; data is not retained.
    Properties:
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault: {SSEAlgorithm: AES256}
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        IgnorePublicAcls: true
        BlockPublicPolicy: true
        RestrictPublicBuckets: true
      OwnershipControls:
        Rules:
          - ObjectOwnership: BucketOwnerEnforced

  QueryResultsBucket:
    Type: AWS::S3::Bucket
    DeletionPolicy: Delete
    UpdateReplacePolicy: Delete
    Metadata:
      com.aws.cloudformation.Context:
        why: Private disposable Athena query results.
        must:
          - Empty all objects before stack deletion or replacement; data is not retained.
    Properties:
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault: {SSEAlgorithm: AES256}
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        IgnorePublicAcls: true
        BlockPublicPolicy: true
        RestrictPublicBuckets: true
      OwnershipControls:
        Rules:
          - ObjectOwnership: BucketOwnerEnforced

  RawEventsBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref RawEventsBucket
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Deny
            Principal: '*'
            Action: 's3:*'
            Resource: [!GetAtt RawEventsBucket.Arn, !Sub '${RawEventsBucket.Arn}/*']
            Condition:
              Bool: {'aws:SecureTransport': 'false'}

  QueryResultsBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref QueryResultsBucket
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Deny
            Principal: '*'
            Action: 's3:*'
            Resource: [!GetAtt QueryResultsBucket.Arn, !Sub '${QueryResultsBucket.Arn}/*']
            Condition:
              Bool: {'aws:SecureTransport': 'false'}

  AnalyticsDatabase:
    Type: AWS::Glue::Database
    Metadata:
      com.aws.cloudformation.Context:
        why: Catalog for Firehose conversion and Athena without a crawler.
    Properties:
      CatalogId: !Ref AWS::AccountId
      DatabaseInput:
        Name: !Sub '${AWS::StackName}-analytics'
        Description: Pulsar raw events catalog

  EventsTable:
    Type: AWS::Glue::Table
    Metadata:
      com.aws.cloudformation.Context:
        why: Shared JSON conversion schema and projected arrival-date partitions for Parquet.
        must:
          - Keep the storage template aligned with the Firehose UTC timestamp prefix.
    Properties:
      CatalogId: !Ref AWS::AccountId
      DatabaseName: !Ref AnalyticsDatabase
      TableInput:
        Name: events
        TableType: EXTERNAL_TABLE
        Parameters:
          classification: parquet
          projection.enabled: 'true'
          projection.dt.type: date
          projection.dt.format: yyyy-MM-dd
          projection.dt.range: '2020-01-01,NOW'
          projection.dt.interval: '1'
          projection.dt.interval.unit: DAYS
          storage.location.template: !Sub 's3://${RawEventsBucket}/events/dt=${!dt}/'
        PartitionKeys:
          - {Name: dt, Type: string}
        StorageDescriptor:
          Location: !Sub 's3://${RawEventsBucket}/events/'
          InputFormat: org.apache.hadoop.hive.ql.io.parquet.MapredParquetInputFormat
          OutputFormat: org.apache.hadoop.hive.ql.io.parquet.MapredParquetOutputFormat
          SerdeInfo:
            SerializationLibrary: org.apache.hadoop.hive.ql.io.parquet.serde.ParquetHiveSerDe
          Columns:
            - {Name: eventid, Type: string}
            - {Name: type, Type: string}
            - {Name: impressionid, Type: string}
            - {Name: campaignid, Type: string}
            - {Name: creativeid, Type: string}
            - {Name: placement, Type: string}
            - {Name: sessionid, Type: string}
            - {Name: ts, Type: bigint}

  EventDeliveryRole:
    Type: AWS::IAM::Role
    Metadata:
      com.aws.cloudformation.Context:
        why: Firehose can read the conversion schema and write only its analytics bucket.
    Properties:
      PermissionsBoundary: !If [HasDeploymentPermissionsBoundary, !Ref DeploymentPermissionsBoundary, !Ref 'AWS::NoValue']
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal: {Service: firehose.amazonaws.com}
            Action: sts:AssumeRole
            Condition:
              StringEquals: {'sts:ExternalId': !Ref AWS::AccountId}
      Policies:
        - PolicyName: delivery
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: [s3:AbortMultipartUpload, s3:GetBucketLocation, s3:GetObject, s3:ListBucket, s3:ListBucketMultipartUploads, s3:PutObject]
                Resource: [!GetAtt RawEventsBucket.Arn, !Sub '${RawEventsBucket.Arn}/*']
              - Effect: Allow
                Action: [glue:GetTable, glue:GetTableVersion, glue:GetTableVersions]
                Resource:
                  - !Sub 'arn:${AWS::Partition}:glue:${AWS::Region}:${AWS::AccountId}:catalog'
                  - !Sub 'arn:${AWS::Partition}:glue:${AWS::Region}:${AWS::AccountId}:database/${AnalyticsDatabase}'
                  - !Sub 'arn:${AWS::Partition}:glue:${AWS::Region}:${AWS::AccountId}:table/${AnalyticsDatabase}/events'

  EventStream:
    Type: AWS::KinesisFirehose::DeliveryStream
    Metadata:
      com.aws.cloudformation.Context:
        why: Direct PUT event ingestion with buffered Parquet delivery and separate conversion errors.
        must:
          - The dt prefix reflects Firehose arrival time, not the event timestamp.
          - Buffered data and failed delivery may outlive a cost-guard shutdown and incur charges.
    Properties:
      DeliveryStreamType: DirectPut
      ExtendedS3DestinationConfiguration:
        BucketARN: !GetAtt RawEventsBucket.Arn
        RoleARN: !GetAtt EventDeliveryRole.Arn
        Prefix: 'events/dt=!{timestamp:yyyy-MM-dd}/'
        ErrorOutputPrefix: 'errors/!{firehose:error-output-type}/dt=!{timestamp:yyyy-MM-dd}/'
        BufferingHints:
          IntervalInSeconds: 900
          SizeInMBs: 128
        DataFormatConversionConfiguration:
          Enabled: true
          InputFormatConfiguration:
            Deserializer:
              OpenXJsonSerDe:
                CaseInsensitive: true
          OutputFormatConfiguration:
            Serializer:
              ParquetSerDe:
                Compression: SNAPPY
          SchemaConfiguration:
            CatalogId: !Ref AWS::AccountId
            DatabaseName: !Ref AnalyticsDatabase
            TableName: !Ref EventsTable
            Region: !Ref AWS::Region
            RoleARN: !GetAtt EventDeliveryRole.Arn

  AnalyticsWorkGroup:
    Type: AWS::Athena::WorkGroup
    Metadata:
      com.aws.cloudformation.Context:
        why: Separate workgroup enforces encrypted results in the disposable query bucket.
        must:
          - Query and storage charges continue independently of the Lambda cost guard.
    Properties:
      Name: !Sub '${AWS::StackName}-analytics'
      RecursiveDeleteOption: true
      WorkGroupConfiguration:
        EnforceWorkGroupConfiguration: true
        ResultConfiguration:
          OutputLocation: !Sub 's3://${QueryResultsBucket}/results/'
          EncryptionConfiguration:
            EncryptionOption: SSE_S3

  BudgetTopic:
    Type: AWS::SNS::Topic
    Metadata:
      com.aws.cloudformation.Context:
        why: Non-sensitive budget threshold notifications; no customer-managed KMS key monthly charge.
        must:
          - Only this account's named budget may publish.
    Properties:
      TopicName: !Sub '${AWS::StackName}-budget'

  BudgetTopicPolicy:
    Type: AWS::SNS::TopicPolicy
    Properties:
      Topics: [!Ref BudgetTopic]
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: budgets.amazonaws.com
            Action: sns:Publish
            Resource: !Ref BudgetTopic
            Condition:
              StringEquals:
                aws:SourceAccount: !Ref AWS::AccountId
              ArnEquals:
                aws:SourceArn: !Sub 'arn:${AWS::Partition}:budgets::${AWS::AccountId}:budget/${AWS::StackName}-monthly'

  CostGuardLogGroup:
    Type: AWS::Logs::LogGroup
    DeletionPolicy: Delete
    UpdateReplacePolicy: Delete
    Properties:
      LogGroupName: !Sub '/aws/lambda/${AWS::StackName}-cost-guard'
      RetentionInDays: 7

  CostGuardFunction:
    Type: AWS::Serverless::Function
    DependsOn: CostGuardLogGroup
    Properties:
      FunctionName: !Sub '${AWS::StackName}-cost-guard'
      CodeUri: .
      Handler: costGuard.handler
      Timeout: 30
      Environment:
        Variables:
          BUDGET_TOPIC_ARN: !Ref BudgetTopic
          SHOWCASE_FUNCTION_NAMES: !Join [',', [!Ref GetAdFunction, !Ref PostEventsFunction, !Ref GetStatsFunction, !Ref SiteFunction, !Ref AdminFunction]]
      Policies:
        - Statement:
            - Effect: Allow
              Action: lambda:PutFunctionConcurrency
              Resource:
                - !GetAtt GetAdFunction.Arn
                - !GetAtt PostEventsFunction.Arn
                - !GetAtt GetStatsFunction.Arn
                - !GetAtt SiteFunction.Arn
                - !GetAtt AdminFunction.Arn
      Events:
        Budget:
          Type: SNS
          Properties:
            Topic: !Ref BudgetTopic
    Metadata:
      com.aws.cloudformation.Context:
        why: 'Best-effort spending brake: stop both API and static-site Lambda execution.'
        must:
          - Billing is delayed; this cannot guarantee a dollar cap or stop all residual charges.
          - Recovery is manual after reviewing costs; never automatically re-enable each month.
      BuildMethod: esbuild
      BuildProperties:
        Target: es2022
        Format: cjs
        OutExtension: ['.js=.cjs']
        Minify: true
        EntryPoints: [src/handlers/costGuard.ts]

  MonthlyBudget:
    Type: AWS::Budgets::Budget
    DependsOn: BudgetTopicPolicy
    Metadata:
      com.aws.cloudformation.Context:
        why: Account-wide gross monthly cost warning at USD 5; shutdown starts at USD 4 for margin.
        must:
          - Exclude credits and refunds so promotional credits do not mask usage.
          - Not a hard spending cap; AWS billing data and shutdown propagation are delayed.
    Properties:
      Budget:
        BudgetName: !Sub '${AWS::StackName}-monthly'
        BudgetLimit:
          Amount: 5
          Unit: USD
        BudgetType: COST
        TimeUnit: MONTHLY
        CostTypes:
          IncludeCredit: false
          IncludeRefund: false
      NotificationsWithSubscribers:
        - Notification:
            NotificationType: ACTUAL
            ComparisonOperator: GREATER_THAN
            ThresholdType: PERCENTAGE
            Threshold: 80
          Subscribers:
            - SubscriptionType: SNS
              Address: !Ref BudgetTopic
            - SubscriptionType: EMAIL
              Address: !Ref BudgetEmail
        - Notification:
            NotificationType: ACTUAL
            ComparisonOperator: GREATER_THAN
            ThresholdType: PERCENTAGE
            Threshold: 100
          Subscribers:
            - SubscriptionType: SNS
              Address: !Ref BudgetTopic
            - SubscriptionType: EMAIL
              Address: !Ref BudgetEmail

Outputs:
  ApiUrl:
    Description: HTTP API base URL
    Value: !Sub 'https://${HttpApi}.execute-api.${AWS::Region}.${AWS::URLSuffix}'
  TableName:
    Description: DynamoDB table for the seed script
    Value: !Ref AdPlatform
  SiteBucketName:
    Description: Private S3 bucket for the built frontend and original creative assets
    Value: !Ref SiteBucket
  SiteUrl:
    Description: Public HTTPS showcase URL
    Value: !Sub 'https://${HttpApi}.execute-api.${AWS::Region}.${AWS::URLSuffix}'
  BudgetName:
    Description: Account-wide monthly spending budget with delayed, best-effort shutdown
    Value: !Ref MonthlyBudget
  CostGuardFunctionName:
    Description: Shutdown handler subscribed to the budget topic
    Value: !Ref CostGuardFunction
  EventStreamName:
    Description: Direct PUT event delivery stream
    Value: !Ref EventStream
  AnalyticsDatabaseName:
    Description: Glue database containing the projected events table
    Value: !Ref AnalyticsDatabase
  AnalyticsWorkGroupName:
    Description: Athena workgroup for event queries
    Value: !Ref AnalyticsWorkGroup
  RawEventsBucketName:
    Description: Private Parquet events and conversion-error bucket
    Value: !Ref RawEventsBucket
  QueryResultsBucketName:
    Description: Private Athena query results bucket
    Value: !Ref QueryResultsBucket
